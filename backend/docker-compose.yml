services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: epicenter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - epicenter_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/epicenter
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      ETL_SCHEDULE_HOURS: ${ETL_SCHEDULE_HOURS:-24}
    ports:
      - "8000:8000"

  etl-seed:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/epicenter
    command: ["python", "-m", "etl.import_disasters"]
    restart: "no"

volumes:
  epicenter_pgdata:
